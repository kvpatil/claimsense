# ClaimSense Postgres. Port 5433, not 5432: the Meridian reference stack binds
# 5432 and both are often up at once.
services:
  claimsense-db:
    image: postgres:16
    container_name: claimsense-db
    environment:
      POSTGRES_USER: claimsense
      POSTGRES_PASSWORD: claimsense
      POSTGRES_DB: claimsense
    ports:
      - "5433:5432"
    volumes:
      - claimsense-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimsense"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  claimsense-pgdata:
